# Tooling · Banco descartável no CI
#
# Sobe o Supabase local (Postgres + Auth + REST) a partir das migrations do
# repositório e roda os testes pgTAP de supabase/tests. É a base para o e2e
# de fluxos logados sem tocar em produção nem mandar e-mail de verdade.
name: DB

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pgtap:
    name: Migrations · pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase from migrations
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor,realtime
      - name: Seed
        run: supabase db reset --local
      - name: pgTAP
        run: supabase test db
